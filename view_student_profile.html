<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details</title>
    <link rel="stylesheet" href="view_student_profile.css"> <!-- External CSS -->
</head>

<body>
    <div class="container">
        <h1>Student Details</h1>

        <!-- Table for displaying student details -->
        <table id="studentDetailsTable">
            <tbody>
                <tr>
                    <th>ID</th>
                    <td id="studentId"></td>
                </tr>
                <tr>
                    <th>Name</th>
                    <td id="studentName"></td>
                </tr>
                <tr>
                    <th>Branch</th>
                    <td id="studentBranch"></td>
                </tr>
                <tr>
                    <th>Batch</th>
                    <td id="studentBatch"></td>
                </tr>
                <tr>
                    <th>Phone Number</th>
                    <td id="studentPhone"></td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td id="studentEmail"></td>
                </tr>
            </tbody>
        </table>

        <!-- QR Code Section -->
        <div class="qr-section">
            <h3>QR Code</h3>
            <img id="qrCodeImage" alt="QR Code" />
        </div>

        <!-- Attendance Table -->
        <h3>Attendance</h3>
        <table id="attendanceTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Attendance rows will be dynamically inserted here -->
            </tbody>
        </table>
    </div>

    <script>

        // Function to get a cookie value by name
        function getCookie(name) {
            const cookies = document.cookie.split('; ');
            for (let i = 0; i < cookies.length; i++) {
                const [cookieName, cookieValue] = cookies[i].split('=');
                if (cookieName.trim() === name) {
                    return decodeURIComponent(cookieValue);
                }
            }
            return null;
        }

        // Function to check authentication and return the token
        function checkAuth() {
            const token = getCookie('token');
            if (!token) {
                console.warn("No token found. Redirecting to login...");
                window.location.href = "sign_in.html";
                return null;
            }
            return token;  // Return the token
        }

        // Function to extract query parameters from the URL
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Function to fetch and display the student's details
        async function fetchStudentDetails(studentId, token) {
            try {
                const response = await fetch(`http://localhost:8080/student/view/${studentId}`, {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                // Console log the entire response object
                console.log("Response:", response);

                const data = await response.json();

                // Console log the parsed JSON data
                console.log("Data:", data);

                const student = data["student detail"]; // Extract student details

                // Insert the student details into the table
                document.getElementById('studentId').textContent = student.id;
                document.getElementById('studentName').textContent = student.name;
                document.getElementById('studentBranch').textContent = student.branch;
                document.getElementById('studentBatch').textContent = student.batch;
                document.getElementById('studentPhone').textContent = student.phoneno;
                document.getElementById('studentEmail').textContent = student.email;

                // Display the QR Code image from the base64-encoded image string
                const qrCodeImage = document.getElementById('qrCodeImage');
                qrCodeImage.src = `data:image/png;base64,${student.image}`;
                qrCodeImage.alt = `QR Code for ${student.name}`;

                // Populate attendance table
                const attendanceTableBody = document.getElementById('attendanceTable').querySelector('tbody');
                attendanceTableBody.innerHTML = ''; // Clear any existing rows

                for (const [date, status] of Object.entries(student.attandance)) {
                    const row = document.createElement('tr');
                    const dateCell = document.createElement('td');
                    dateCell.textContent = date;
                    const statusCell = document.createElement('td');
                    statusCell.textContent = status;
                    row.appendChild(dateCell);
                    row.appendChild(statusCell);
                    attendanceTableBody.appendChild(row);
                }
            } catch (error) {
                console.error('Error fetching student details:', error);
            }
        }

        // Check authentication when the page loads
        document.addEventListener("DOMContentLoaded", function () {
            const token = checkAuth();  // Get token from checkAuth
            if (token) {
                // Extract the studentId from the URL and call the function
                const studentId = getQueryParam('studentId');
                if (studentId) {
                    fetchStudentDetails(studentId, token);  // Pass token as argument
                } else {
                    console.error('No student ID found in URL');
                }
            }
        });

    </script>
</body>

</html>
