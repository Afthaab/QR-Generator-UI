<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="teacher_signup.css">
</head>
<body>
    <div class="wrapper">
        <h2>Registration</h2>
        <form id="signup-form">
            <div class="input-box">
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="input-box">
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Create password" required>
            </div>
            <div class="input-box">
                <input type="password" id="repeatpassword" placeholder="Confirm password" required>
            </div>
            <div class="input-box">
                <input type="password" id="securitykey" placeholder="Security KEY" required>
            </div>
            
            <div class="input-box button">
                <input type="submit" value="Register Now">
            </div>
           
        </form>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission

            // Get form data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                repeatpassword: document.getElementById('repeatpassword').value,
                securitykey: document.getElementById("securitykey").value
            };

            // Validate form data (basic check)
            if (formData.password !== formData.repeatpassword) {
                alert("Passwords do not match!");
                return;
            }

            // Send data to the API
            fetch('http://localhost:8080/teacher/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                alert('Registration successful!');
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Error submitting form');
            });
        });
    </script>
</body>
</html>
