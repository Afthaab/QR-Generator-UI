<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="student_reg.css">
</head>

<body>
    <div class="four">
        <h1><span>Student Register Page</span> <em>Please fill the below fields</em> </h1>
    </div>
    <div>
        <div class="container">
            <form onsubmit="return handleSubmit(event)">
                <div class="row">
                    <div class="col-25">
                        <label for="name">Name</label>
                    </div>
                    <div class="col-75">
                        <input type="text" id="name" name="name" placeholder="Enter Name.." pattern="[A-Za-z\s]+"
                            title="Only alphabets are allowed" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-25">
                        <label for="branch">Branch</label>
                    </div>
                    <div class="col-75">
                        <select id="branch" name="branch">
                            <option value="bca">BCA</option>
                            <option value="bba">BBA</option>
                            <option value="bcom">BCOM</option>
                        </select>
                    </div>
                </div>
                <div class="row">
                    <div class="col-25">
                        <label for="batch">Batch</label>
                    </div>
                    <div class="col-75">
                        <input type="text" id="batch" name="batch" placeholder="Enter Batch.." required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-25">
                        <label for="phone">Phone Number</label>
                    </div>
                    <div class="col-75">
                        <input type="text" id="phone" name="phone" placeholder="Enter Phone Number.."
                            pattern="[0-9]{10}" title="Phone number must be exactly 10 digits" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-25">
                        <label for="email">Email</label>
                    </div>
                    <div class="col-75">
                        <input type="text" id="email" name="email" placeholder="Enter Email.." required>
                    </div>
                </div>
                <div class="row">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </div>

        <div id="loader" class="loader-overlay" style="display: none;">
            <div class="loader"></div>
        </div>


        <script>
            async function handleSubmit(event) {
                event.preventDefault(); // Prevent form submission from reloading the page

                // Show loader
                document.getElementById("loader").style.display = "flex";

                const name = document.getElementById("name").value;
                const phoneno = document.getElementById("phone").value;
                const email = document.getElementById("email").value;
                const batch = document.getElementById("batch").value;
                const branch = document.getElementById("branch").value;

                // Prepare the data to be sent to the API
                const data = {
                    name: name,
                    branch: branch,
                    batch: batch,
                    email: email,
                    phoneno: phoneno
                };

                try {
                    const response = await fetch("http://localhost:8080/teacher/student/register", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });

                    // Hide loader after receiving the response
                    document.getElementById("loader").style.display = "none";

                    // Handle the API response
                    if (response.ok) {
                        const result = await response.json();
                        console.log("Success:", result);
                        alert("Form submitted successfully!");
                    } else {
                        const errorData = await response.json();
                        console.error("Error submitting form:", errorData.error);
                        alert("Error: " + errorData.error);
                    }
                } catch (error) {
                    // Hide loader if there was a network error
                    document.getElementById("loader").style.display = "none";
                    console.error("Network error:", error);
                    alert("Network error. Please try again later.");
                }

                return false; // Prevent form submission to the PHP page
            }

        </script>

</body>

</html>
