<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="teacher_dashboard.css">
    <title>Document</title>
</head>

<body>
    <div class="four">
        <h1><span>Welcome to the Dashboard</span> <em>Choose the below options</em></h1>
    </div>

    <div>
        <button onclick="registerStudentDetails()">Register Student Details</button>
        <button onclick="viewAllStudents()">View All Students</button>
        <button onclick="RegisterAttendance()">Register Student Attendance</button>
        <button onclick="viewAllStudentsAttendance()">View Student Attendance</button>
    </div>

    <script>

        function getCookie(name) {
            const cookies = document.cookie.split('; ');
            for (let i = 0; i < cookies.length; i++) {
                const [cookieName, cookieValue] = cookies[i].split('=');
                if (cookieName === name) {
                    return cookieValue;
                }
            }
            return null;
        }

        // Function to check authentication
        function checkAuth() {
            const token = getCookie('token'); // Ensure this matches your backend's cookie name

            if (!token) {
                // Redirect to login page if token is missing
                window.location.href = "sign_in.html";
                return;
            }
        }

        function registerStudentDetails() {
            window.location.href = "student_reg.html"; // Change to your actual URL
        }

        function viewAllStudents() {
            window.location.href = "view_all_student.html"; // Change to your actual URL for viewing all students
        }

        function viewAllStudentsAttendance() {
            window.location.href = "view_students_attendance.html";
        }

        function RegisterAttendance() {
            window.location.href = "attendance_resgister.html";
        }

        // Check authentication when the page loads
        document.addEventListener("DOMContentLoaded", checkAuth);


    </script>

</body>

</html>
