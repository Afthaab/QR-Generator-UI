<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Registered Students</title>
    <link rel="stylesheet" href="view_all_student.css">
</head>

<body>
    <div class="container">
        <div class="four">
            <h1><span>Select view to see the student details</span> <em>All Registered Students</em></h1>
        </div>
        <ul class="responsive-table" id="studentTable">
            <li class="table-header">
                <div class="col col-1">S. No.</div>
                <div class="col col-2">Student Name</div>
                <div class="col col-3">Branch</div>
                <div class="col col-4">Batch</div>
                <div class="col col-5">View</div>
            </li>
        </ul>
    </div>

    <script>
        let token = null; // Declare token as a global variable

        // Function to get a cookie value by name
        function getCookie(name) {
            const cookies = document.cookie.split('; ');
            for (let i = 0; i < cookies.length; i++) {
                const [cookieName, cookieValue] = cookies[i].split('=');
                if (cookieName.trim() === name) {
                    return decodeURIComponent(cookieValue);
                }
            }
            return null;
        }

        // Function to check authentication
        function checkAuth() {
            token = getCookie('token'); // ✅ Assign to global token

            if (!token) {
                console.warn("No token found. Redirecting to login...");
                window.location.href = "sign_in.html";
                return;
            }
        }

        // Function to fetch student details from API
        async function fetchStudentDetails() {
            try {
                const response = await fetch('http://localhost:8080/student/view/all', {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                });
                const data = await response.json();
                const students = data["student details"];
                populateTable(students);
            } catch (error) {
                console.error('Error fetching student data:', error);
            }
        }

        // Function to populate the table with student data
        function populateTable(students) {
            const table = document.getElementById('studentTable');
            students.forEach((student, index) => {
                const row = document.createElement('li');
                row.classList.add('table-row');

                // Insert incrementing number for each student
                row.innerHTML = `
                    <div class="col col-1" data-label="S. No.">${index + 1}</div>
                    <div class="col col-2" data-label="Student Name">${student.name}</div>
                    <div class="col col-3" data-label="Branch">${student.branch}</div>
                    <div class="col col-4" data-label="Batch">${student.batch}</div>
                    <div class="col col-5" data-label="View">
                        <button class="view-button" onclick="viewStudent('${student.id}')">View</button>
                    </div>
                `;
                table.appendChild(row);
            });
        }

        // Function to view a student's details by redirecting to another page
        function viewStudent(studentId) {
            // Redirect to a new page, passing the student ID as a query parameter
            window.location.href = `teacher_student_view.html?studentId=${studentId}`;
        }

        window.onload = function () {
            checkAuth(); // First, check authentication
            fetchStudentDetails(); // Then, fetch student details
        };


    </script>
</body>

</html>
